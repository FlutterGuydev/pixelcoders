<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungeons of Kithspire</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .landing {
    max-width: 720px;
    margin: 60px auto;
    padding: 0 24px;
    text-align: center;
  }
  .landing h1 { font-size: 28px; margin-bottom: 6px; }
  .landing p { color: var(--text-dim); margin-bottom: 32px; }
  .wing-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }
  .wing-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
  }
  .wing-card.locked { opacity: 0.5; pointer-events: none; }
  .wing-card .wing-icon { font-size: 32px; display: block; margin-bottom: 10px; }
  .wing-card h3 { margin: 0 0 4px; font-size: 15px; }
  .wing-card span { color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>
<div class="landing">
  <h1>Dungeons of Kithspire</h1>
  <p>Choose a wing to begin.</p>
  <div class="wing-cards">
    <a class="wing-card" href="levels/js-level-1.html">
      <span class="wing-icon">🌲</span>
      <h3>Kithspire Forest</h3>
      <span>JavaScript — 0/1 complete</span>
    </a>
    <div class="wing-card locked">
      <span class="wing-icon">🚪</span>
      <h3>The Ruined Gate</h3>
      <span>HTML — locked</span>
    </div>
    <div class="wing-card locked">
      <span class="wing-icon">🔒</span>
      <h3>The Sealed Vault</h3>
      <span>CSS — locked</span>
    </div>
  </div>
</div>
</body>
</html>
